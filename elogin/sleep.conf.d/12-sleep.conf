# suspend-then-hibernate: suspend immediately for fast resume, then force a full
# hibernate after 1h regardless of battery level (HibernateDelaySec overrides the
# default estimate-based/<5% behavior).
[Sleep]
AllowHibernation=yes
AllowSuspendThenHibernate=yes
SuspendState=freeze
HibernateOnACPower=no
HibernateDelaySec=1h
